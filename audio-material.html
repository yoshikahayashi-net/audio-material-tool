<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>音声→資料化ツール</title>
<style>
:root{--blue:#168BCB;--blue2:#0D6DA6;--sky:#EAF9FE;--green:#50C36A;--ink:#173244;--muted:#6B8090;--line:#CFE3ED;--bg:#F3FAFD;--white:#fff;--shadow:0 12px 30px rgba(18,91,125,.12)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Yu Gothic",sans-serif}.wrap{max-width:900px;margin:0 auto;padding:24px 18px 48px}.hero{background:linear-gradient(135deg,#0f73ad,#168bcB);color:#fff;border-radius:22px;padding:24px 22px;box-shadow:var(--shadow)}.kicker{font-size:11px;letter-spacing:.12em;font-weight:900;opacity:.82}.title{font-size:28px;font-weight:900;margin-top:6px}.sub{margin-top:8px;font-size:13px;line-height:1.65;opacity:.94}.card{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.labeb{font-size:12px;font-weight:900;color:var(--blue2);margin-bottom:8px}.file{width:100%;padding:12px;border:1px dashed #9fc9dc;border-radius:14px;background:#F8FCFE}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.stage{border:1px solid var(--line);border-radius:14px;padding:12px}.stage strong{display:block;font-size:13px}.stage textarea{width:100%;margin-top:8px;min-height:64px;border:1px solid var(--line);border-radius:10px;padding:9px;resize:vertical;font:inherit;font-size:12px}.btn{width:100%;height:48px;margin-top:14px;border:0;border-radius:13px;background:var(--blue);color:#fff;font-weight:900;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.status{margin-top:12px;padding:11px 12px;border-radius:12px;background:F2F8FB;color:#557382;font-size:12px;line-height:1.6}.progress{margin-top:8px;height:8px;background:#E7F0F4;border-radius:999px;overflow:hidden}.bar{height:100%;width:0;background:var(--green);transition:width .2s}.bar.processing{width:45%;animation:progressPulse 1.2s ease-in-out infinite}@keyframes progressPulse{0%{transform:translateX(-55%);opacity:.55}50%{transform:translateX(55%);opacity:1}100%{transform:translateX(155%);opacity:.55}}.results{display:none;margin-top:16px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tab.active{background:var(--sky);border-color:#9BCFE2;color:var(--blue2)}.out{margin-top:10px;white-space:pre-wrap;font-size:12px;line-height:1.7;background:#0F2737;color:#EAF7FC;border-radius:14px;padding:14px;max-height:520px;overflow:auto}.downloads{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.dl{border:1px solid var(--line);background:#fff;color:var(--blue2);border-radius:10px;padding:9px 12px;font-weight:900;cursor:pointer}.note{margin-top:12px;font-size:10px;color:var(--muted);line-height:1.6}.error{background:#FFF2EF;color:#994B40;border:1px solid #F0C7BE}.ok{background:#F0FFF3;color:#367947;border:1px solid #BDE3C5}@media(max-width:650px){.row{grid-template-columns:1fr}.title{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <div class="kicker">LOCAL AI WORK TOOL</div>
    <div class="title">🎙 音声 → 資料化</div>
    <div class="sub">音声ファイルを選ぶだけ。文字起こしはブラウザ内で実行し、指定した工程だけに整理します。APIキー・課金・PCへのPython導入偯不要です。</div>
  </section>

  <section class="card">
    <div class="label">1. 音声ファイル</div>
    <input id="audioFile" class="file" type="file" accept="audio/*,.wav,.mp3,.m4a,.flac">
    <div id="fileInfo" class="status">まだ音声ファイルが選択されていません。</div>

    <div class="label" style="margin-top:16px">2. 指定工程</div>
    <div class="row">
      <div class="stage"><strong>工程A：仕上</strong><textarea id="kwFinish">仕上,仕上げ,仕上工程</textarea></div>
      <div class="stage"><strong>工程B：ショット</strong><textarea id="kwShot">ショット,ショット工程</textarea></div>
    </div>

    <button id="runBtn" class="btn" disabled>資料化を開始</button>
    <div id="status" class="status">待機中です。</div>
    <div class="progress"><div id="bar" class="bar"></div></div>
    <div class="note">初回だけWhisperモデルをブラウザが自動ダウンロードします。以後はブラウザキャッシュを利用します。音声ファイルはこの処理のために外部APIへ送信しません。</div>
  </section>

  <section id="results" class="card results">
    <div class="label">3. 出力</div>
    <div class="tabs">
      <button class="tab active" data-tab="all">総合</button>
      <button class="tab" data-tab="finish">仕上</button>
      <button class="tab" data-tab="shot">ショット</button>
      <button class="tab" data-tab="unknown">未分類</button>
      <button class="tab" data-tab="raw">全文</button>
    </div>
    <div id="out" class="out"></div>
    <div class="downloads">
      <button id="txtBtn" class="dl">TXT保存</button>
      <button id="mdBtn" class="dl">Markdown保存</button>
      <button id="docBtn" class="dl">Wordで開ける形式で保存</button></button>
    </div>
  </section>
</div>
<script type="module" src="./app.js?v=20261001-15"></script>
</body>
</html>
